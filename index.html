px 0}.warn{border-left-color:#f4c271}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:#d3e0ed;font-weight:700}.field input,.field select{width:100%;padding:10px 9px;color:#f3efda;background:#101e34;border:2px solid #5c7393;border-radius:0;min-width:0}.field input:focus,.field select:focus{outline:2px solid #83d6be;outline-offset:1px}input[type=range]{accent-color:#75d8ae;width:100%}.items{display:grid;gap:10px}.asset{display:flex;align-items:center;justify-content:space-between;border-bottom:1px dashed #526787;padding:11px 0;gap:10px}.asset:last-child{border:0}.asset .assetActions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.asset strong{display:block}.chip{border:2px solid #61738b;background:#273b58;color:#e5e8dd;padding:7px 11px;font-size:12px}.chip.active{background:#4b8878;border-color:#a2e9be;color:white}.quest{border:2px solid #455c7a;background:#1a2b45;padding:11px;cursor:pointer;display:flex;align-items:center;gap:9px;text-align:left;color:#f5ebdc;width:100%}.quest.active{border-color:#81dab6;background:#2d5257}.quest b{font-size:17px}.option{border:2px solid #526786;background:#1e304d;color:#f8f1e3;text-align:left;padding:12px;width:100%;margin-bottom:8px;cursor:pointer}.option.selected{border-color:var(--mint);background:#2d5455}.day{background:#1b2c47;border:2px solid #526787;text-align:center;padding:7px 2px;font-size:12px}.day.claimed{background:#315b56;border-color:#7ad7af}.day.today{border-color:var(--gold)}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day strong{display:block;font-size:18px;color:var(--gold)}.shop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.shopItem{border:2px solid #506887;padding:13px;text-align:center;background:#1b2c45}.shopItem .avatar{font-size:32px}.tableWrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}th,td{padding:9px 8px;border-bottom:1px solid #455a75;white-space:nowrap}th{color:#bbd9e5}.spark{width:100%;height:145px;background:#101d31;border:2px solid #425a7a}.pill{border:1px solid #556d86;padding:3px 7px;font-size:11px;color:#b9cbe0}.rule{height:1px;background:#455d78;margin:16px 0}.stat{font-size:18px;font-weight:900;color:#f8d17c}.log{display:grid;gap:8px;max-height:265px;overflow:auto}.logItem{padding:9px;background:#1c2e48;border-left:3px solid #6fae9d;font-size:12px}.welcome{font-size:13px;line-height:1.8;color:#d7e4e7}.footer{margin:17px 0;font-size:11px;color:#aabdd2;text-align:center}.toast{position:fixed;bottom:17px;right:18px;max-width:min(94vw,390px);background:#e7d6a6;color:#243548;border:3px solid #806b47;padding:12px 15px;font-weight:700;z-index:50;box-shadow:5px 5px #070d16}.modalBack{position:fixed;inset:0;background:#06101dcc;display:grid;place-items:center;padding:15px;z-index:30}.modal{background:#243754;border:4px solid #92afbb;max-width:540px;width:100%;max-height:90vh;overflow-y:auto;padding:19px;box-shadow:8px 8px #090f1e}.modal h3{margin:0 0 12px}.progressLegend{display:flex;gap:10px;justify-content:space-between;font-size:12px}.empty{color:#aec1d3;font-size:12px;padding:16px;background:#17253b}.qa{background:#1a2b46;border:1px solid #597083;padding:11px;margin-top:12px}.qa strong{color:#9be1bd}.done{color:#97e5ba}.sep{border-top:2px dashed #4b6180;margin:16px 0}.assetType{font-size:10px;background:#364960;padding:3px 6px;color:#cddce9}.visualCaption{font-size:11px;color:#aebed0;margin:7px 0}.saveIcon{color:var(--gold)}.choiceRow{display:flex;gap:7px;flex-wrap:wrap}.choiceRow .chip{flex:1}.meter{color:#e3e8dd;font-size:12px;margin-top:8px}

</style></head><body><div class="app"><header class="top"><div class="brand"><div class="brandmark">🛡️</div><div><div class="kicker">PIXEL FINANCE DUNGEON · V2</div><h1 class="pixel-title">財富守護者</h1><div class="kicker">原創像素地城 · 理財冒險</div></div></div><div id="topstats" class="status"></div></header><div class="shell"><aside id="sidebar" class="sidebar"></aside><main id="main" class="frame" aria-live="polite"></main></div><footer class="footer">原型使用說明 <span class="help-pin"><button type="button" class="help-button" aria-label="查看原型重要限制" aria-expanded="false">!</button><span class="help-popup" hidden>本作品是金融教育原型，不提供真實下單、投資建議或即時行情。所有預設市場數值均為示範。</span></span></footer></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(()=>{'use strict';
const KEY='wealth-guardian-v2-pixel',DAYS=86400000;
const $=(sel,ctx=document)=>ctx.querySelector(sel),$$=(sel,ctx=document)=>[...ctx.querySelectorAll(sel)];
const day=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const toDate=d=>new Date(d+'T12:00:00').getTime();const dateDiff=(a,b)=>Math.max(0,Math.round((toDate(b)-toDate(a))/DAYS));
const cash=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW',{maximumFractionDigits:0});
const asPercent=(x)=>Number.isFinite(x)?`${x>=0?'+':''}${(x*100).toFixed(2)}%`:'資料不足';
const safe=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round=n=>Math.round((n+Number.EPSILON)*100)/100;
const clone=o=>JSON.parse(JSON.stringify(o));
const seed=()=>({mode:'demo',tab:'home',cash:22000,assets:[{id:'a1',type:'ETF',symbol:'ETF-A',name:'台股 ETF 範例',qty:100,price:62,cost:59},{id:'a2',type:'stock',symbol:'STK-B',name:'上市股票範例',qty:12,price:925,cost:875}],records:[],snapshots:[],boss:'inflation',duration:6,challengeStart:day(),baseTotal:39300,baseInvest:17300,startEventCount:0,benchmarkYear:0.06,inflationYear:0.02,coins:0,lastCheck:'',streak:0,checkCount:0,bonusIds:[],achievements:[],purchases:[],learning:[],qIndex:0,quizStep:0,quizDraft:{},showGuide:true,notice:'',revision:2});
let s=seed();try{let stored=localStorage.getItem(KEY);if(stored)s={...seed(),...JSON.parse(stored),notice:''}}catch(e){};
if(!Array.isArray(s.assets))s.assets=[];if(!Array.isArray(s.records))s.records=[];if(!Array.isArray(s.learning))s.learning=[];if(!Array.isArray(s.snapshots))s.snapshots=[];if(!Array.isArray(s.purchases))s.purchases=[];if(!Array.isArray(s.achievements))s.achievements=[];if(!Array.isArray(s.bonusIds))s.bonusIds=[];
const invest=()=>s.assets.reduce((v,a)=>v+(+a.qty||0)*(+a.price||0),0);
const total=()=>s.cash+invest();
const startRecord=()=>s.records.slice(0,Math.max(0,s.records.length-(s.startEventCount||0)));
const initSnapshot=()=>{if(!s.snapshots.length)s.snapshots.push({date:day(),total:total(),invest:invest(),kind:'start'})};initSnapshot();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({...s,notice:''}))}catch(e){}};
const notify=(t)=>{let el=$('#toastRoot');el.innerHTML=`<div role="status" class="toast">${safe(t)}</div>`;setTimeout(()=>{el.innerHTML=''},3300)};
const setTab=tab=>{s.tab=tab;render()};
const $num=(sel)=>Number($(sel)?.value);
function snapshot(kind){s.snapshots.push({date:day(),total:round(total()),invest:round(invest()),kind});if(s.snapshots.length>450)s.snapshots=s.snapshots.slice(-450)}
function addRecord(type,desc,amount=0,stockId=null,qty=0,external=0,investFlow=0){s.records.unshift({id:`e${Date.now()}_${Math.random().toString(36).slice(2,6)}`,date:day(),type,desc,amount,stockId,qty,external,investFlow});snapshot(type)}
function challengeReturn(){let starting=s.boss==='inflation'?s.baseTotal:s.baseInvest;let current=s.boss==='inflation'?total():invest();if(starting<=0)return null;
 // Modified Dietz estimate: weights approximate cash-flow timing, not a certified total return.
 let elapsed=Math.max(1,dateDiff(s.challengeStart,day()));let flows=0,weighted=0;
 for(let r of startRecord()){let f=s.boss==='inflation'?r.external:r.investFlow;flows+=f;weighted+=f*Math.max(0,elapsed-dateDiff(s.challengeStart,r.date))/elapsed}
 const denom=starting+weighted;return denom>0?(current-starting-flows)/denom:null;
}
function benchmark(){let t=Math.min(dateDiff(s.challengeStart,day())/365.25,s.duration/12);return Math.pow(1+(s.boss==='inflation'?s.inflationYear:s.benchmarkYear),t)-1}
function remaining(){let now=new Date(s.challengeStart+'T12:00:00');let end=new Date(now);end.setMonth(end.getMonth()+s.duration);return Math.max(0,Math.ceil((end-new Date(day()+'T12:00:00'))/DAYS))}
const NAV=[['home','🏠','冒險大廳'],['assets','🎒','資產背包'],['boss','⚔️','魔王地城'],['daily','🧩','每日試煉'],['report','📜','冒險圖鑑'],['settings','⚙️','資料設定']];
function common(){ $('#sidebar').innerHTML=NAV.map(([id,ic,t])=>`<button type="button" data-nav="${id}" class="navbtn ${s.tab===id?'active':''}"><span>${ic}</span>${t}</button>`).join('')+`<div class="sidebarFoot">${s.mode==='demo'?'🧪 示範模式':'✍️ 自填模式'} <span class="help-pin"><button type="button" class="help-button" aria-label="資料與行情說明" aria-expanded="false">!</button><span class="help-popup" hidden>資料僅存於本機瀏覽器，不會自動上傳雲端。目前沒有真實行情連線。</span></span></div>`;
$('#topstats').innerHTML=`<span class="tag gold">🪙 ${s.coins} 金幣</span><span class="tag">🗓️ ${s.duration} 個月挑戰</span><span class="tag">${s.mode==='demo'?'🧪 示範模式':'✍️ 自填模式'}</span>`}
const head=(t,sub,right='')=>`<div class="heading"><div><h2>${t}${sub?`<span class="help-pin"><button type="button" class="help-button" aria-label="${t}說明" aria-expanded="false">!</button><span class="help-popup" hidden>${sub}</span></span>`:''}</h2></div>${right}</div>`;
const stat=(t,n,detail='')=>`<div class="card"><div class="small">${t}${detail?`<span class="help-pin"><button type="button" class="help-button" aria-label="${t}說明" aria-expanded="false">!</button><span class="help-popup" hidden>${detail}</span></span>`:''}</div><div class="num">${n}</div></div>`;
function scene(){return `<div class="bossScene"><canvas id="pixelScene" width="480" height="208" aria-label="原創像素地下城：冒險者面對通膨或大盤魔王"></canvas><div class="sceneLabel">${s.boss==='inflation'?'🔥 通膨岩魔':'🐂 大盤鐵牛'} · 像素魔王房</div></div>`}
function home(){let r=challengeReturn(),b=benchmark();let gap=r===null?null:r-b;let completed=new Set(s.learning.map(x=>x.index));return `${head('冒險大廳','今天也一起守護購買力，不需要為了遊戲下單。','<span class="tag gold">LEVEL 01 · 財務探索者</span>')}
${scene()}<div class="grid g3">${stat('總資產估值',cash(total()),'手動示範價／非市場行情')}${stat('投資部位',cash(invest()),`${s.assets.length} 筆持有部位`)}${stat('學習紀錄',`${completed.size} / 7`,'七大財務構面')}</div>
<div class="grid g2" style="margin-top:14px"><section class="card"><div class="space"><h3>⚔️ 魔王挑戰</h3><span class="tag">${s.boss==='inflation'?'入門':'進階'}</span></div><div class="space"><div><div class="small">玩家估算表現</div><div class="stat">${asPercent(r)}</div></div><div><div class="small">魔王示範基準</div><div class="stat">${asPercent(b)}</div></div></div><div class="bar" style="margin:12px 0"><i style="width:${gap===null?0:Math.max(4,Math.min(100,50+gap*210))}%"></i></div><p class="small">${gap===null?'資料不足，無法計算':`${Math.abs(gap)<0.00000001?'目前等於':gap>0?'目前高於':'目前低於'}示範基準 ${Math.abs(gap*100).toFixed(2)} 個百分點`}</p><p class="tiny">剩餘約 ${remaining()} 天；比較使用簡化現金流調整，不代表真實投資績效。</p><button class="pixelbtn" data-nav="boss">進入魔王房 →</button></section><section class="card"><h3>🎁 今日任務</h3><div class="space"><div><div class="small">簽到狀態</div><strong>${s.lastCheck===day()?'已領取獎勵':'可以領取簽到獎勵'}</strong></div><div style="font-size:28px">🪙</div></div><div class="rule"></div><div class="space"><div><div class="small">今日金融試煉</div><strong>${s.learning.some(x=>x.date===day())?'已完成部分試煉':'尚未開始'}</strong></div><div style="font-size:28px">🧩</div></div><button class="pixelbtn goldbtn" data-nav="daily" style="margin-top:14px">前往每日試煉 →</button></section></div>
<div class="card dark" style="margin-top:13px"><h3>🗺️ 冒險路線</h3><div class="flex"><span class="pill">建立資產</span>→<span class="pill">挑戰通膨／大盤</span>→<span class="pill">每日簽到</span>→<span class="pill">七大試煉</span>→<span class="pill">學習圖鑑</span></div><div class="hint">🔔 重要：這個原型沒有即時市場串接。挑戰基準與預設股價都只是示範；輸入真實資產並不代表這些價格是真實行情。</div></div>`}
function assets(){return `${head('資產背包','現金、股票與 ETF 可以放進背包；交易事件保留紀錄。','<button class="pixelbtn" data-modal="add">＋ 加入資產</button>')}
<div class="grid g3">${stat('總資產',cash(total()))}${stat('現金／存款',cash(s.cash))}${stat('投資資產',cash(invest()))}</div>

function addModal(){showModal(`<p class="small">只支援新台幣估值；目前不自動查詢市場價格。</p><div class="grid g2"><div class="field"><label>商品類型</label><select id="newType"><option value="ETF">ETF</option><option value="stock">股票</option><option value="fund">基金／其他商品</option></select></div><div class="field"><label>代碼</label><input id="newSymbol" placeholder="例如 0050"></div><div class="field"><label>名稱</label><input id="newName" placeholder="例如 台股 ETF"></div><div class="field"><label>數量</label><input id="newQty" type="number" step="any" min="0" placeholder="100"></div><div class="field"><label>手動價格（TWD）</label><input id="newPrice" type="number" step="any" min="0" placeholder="50"></div><div class="field"><label>每單位成本（TWD）</label><input id="newCost" type="number" step="any" min="0" placeholder="50"></div></div><button class="pixelbtn full" data-action="addAsset" style="margin-top:14px">確認加入</button><div class="hint">新增既有持倉是建立資產快照，不會自動生成過去的交易紀錄。若要開始公平的新挑戰，請重新設定魔王起點。</div>`)}
function editModal(id){let a=s.assets.find(x=>x.id===id);if(!a)return;showModal(`<h3>${safe(a.symbol)} · ${safe(a.name)}</h3><div class="field"><label>新的手動估值價格（TWD）</label><input type="number" min="0" step=".01" value="${a.price}" id="editPrice"></div><button class="pixelbtn full" data-action="applyPrice" data-id="${safe(id)}" style="margin-top:12px">儲存新估值</button><div class="hint">僅更新估值，不代表使用者下單。</div>`)}
function tradeModal(id){let a=s.assets.find(x=>x.id===id);if(!a)return;showModal(`<h3>${safe(a.symbol)} · ${safe(a.name)}</h3><div class="field"><label>交易類型</label><select id="tradeType"><option value="buy">買進</option><option value="sell">賣出</option></select></div><div class="grid g2" style="margin-top:10px"><div class="field"><label>股數／單位數</label><input type="number" min="0" step="any" id="tradeQty" placeholder="10"></div><div class="field"><label>每單位成交價（TWD）</label><input type="number" min="0" step="any" id="tradePrice" value="${a.price}"></div></div><button class="pixelbtn full" style="margin-top:12px" data-action="applyTrade" data-id="${safe(id)}">記錄交易</button><div class="hint">買進從現金扣款，賣出回到現金；暫未計入手續費、證交稅及其他費用。</div>`)}
function drawPixel(){let c=$('#pixelScene');if(!c)return;let g=c.getContext('2d');g.imageSmoothingEnabled=false;let w=c.width,h=c.height;g.fillStyle='#16243a';g.fillRect(0,0,w,h);
for(let y=0;y<h;y+=24)for(let x=0;x<w;x+=24){g.fillStyle=(Math.floor(x/24)+Math.floor(y/24))%2?'#223750':'#1b2f46';g.fillRect(x+1,y+1,22,22);g.fillStyle='#2f4561';g.fillRect(x+2,y+2,3,3)}
for(let x=0;x<w;x+=48){g.fillStyle='#4e4a57';g.fillRect(x,0,44,7);g.fillStyle='#33415b';g.fillRect(x+8,h-10,36,8)}
function px(x,y,sz,clr){g.fillStyle=clr;g.fillRect(x,y,sz,sz)}
function body(x,y,parts,sz=7){parts.forEach(([xx,yy,col])=>px(x+xx*sz,y+yy*sz,sz,col))}
// Original pixel adventurer: cloak, shield and lantern, not an existing game's character.
let hero=[];for(let y=2;y<8;y++)for(let x=1;x<7;x++)hero.push([x,y,y<4?'#f2c99b':x===1||x===6?'#182d47':'#55b99f']);
for(let x=2;x<6;x++)hero.push([x,1,'#7b548e']);hero.push([2,3,'#1f394a'],[5,3,'#1f394a'],[0,5,'#e8b95f'],[0,6,'#c48e39'],[7,5,'#f2d18a'],[7,6,'#d69a4c'],[2,8,'#3d6086'],[5,8,'#3d6086']);body(99,96,hero);
// Original bosses built from pixel blocks.
let boss=[];let inflation=s.boss==='inflation';for(let y=1;y<13;y++)for(let x=1;x<13;x++){let dx=x-6.5,dy=y-7;if(dx*dx/34+dy*dy/40<1.65){let color=inflation?(y<5?'#f3b657':y<9?'#df7858':'#9d4852'):(y<5?'#acc5ed':y<9?'#608fc6':'#365e98');if(x===4||x===9)color=inflation?'#f8ca6a':'#a9d1f3';boss.push([x,y,color])}}
if(inflation){boss.push([3,0,'#fae7a0'],[4,0,'#e39a4c'],[9,0,'#fae7a0'],[10,0,'#e39a4c'],[5,5,'#31293d'],[9,5,'#31293d'],[6,9,'#4c2639'],[7,9,'#4c2639'])}else{boss.push([0,1,'#e6ecf8'],[1,0,'#e6ecf8'],[12,1,'#e6ecf8'],[13,0,'#e6ecf8'],[5,5,'#18243e'],[9,5,'#18243e'],[6,9,'#223e63'],[7,9,'#223e63'])}
body(303,51,boss,8);g.fillStyle='#ffd06e';g.fillRect(202,114,34,8);g.fillRect(214,102,10,32);g.fillStyle='#f2e4ae';g.font='bold 13px monospace';g.fillText('HERO',104,91);g.fillText(inflation?'INFLATION':'MARKET',309,44);
}
function spark(){let e=$('#assetSpark');if(!e)return;let a=s.snapshots.slice(-25);if(!a.length){e.innerHTML='';return}let vals=a.map(x=>x.total),mn=Math.min(...vals),mx=Math.max(...vals),range=Math.max(1,mx-mn),points=vals.map((v,i)=>`${20+(i/Math.max(a.length-1,1))*380},${120-((v-mn)/range)*90}`).join(' ');e.innerHTML=`<line x1="10" y1="120" x2="410" y2="120" stroke="#50627d"/><line x1="10" y1="30" x2="410" y2="30" stroke="#364c69" stroke-dasharray="4 5"/><polyline points="${points}" fill="none" stroke="#76d5ac" stroke-width="4" stroke-linejoin="miter"/>${a.map((x,i)=>{let xx=20+(i/Math.max(a.length-1,1))*380,yy=120-((x.total-mn)/range)*90;return `<rect x="${xx-3}" y="${yy-3}" width="6" height="6" fill="#ffd16d"/>`}).join('')}<text x="13" y="140" fill="#bfd0dc" font-size="10">${a.length} 個手動估值點（可能同日）</text>`}

function compactHints(host){
 if(!host)return;
 const hints=[...host.querySelectorAll('.hint,.visualCaption')];
 for(const el of hints){
   if(el.closest('.help-popup'))continue;
   const text=el.textContent.trim();if(!text){el.remove();continue}
   const pin=document.createElement('span');pin.className='help-pin';
   const btn=document.createElement('button');btn.type='button';btn.className='help-button';btn.textContent='!';btn.setAttribute('aria-label','查看詳細說明');btn.setAttribute('aria-expanded','false');
   const pop=document.createElement('span');pop.className='help-popup';pop.hidden=true;pop.textContent=text;
   pin.append(btn,pop);
   const parent=el.parentElement;
   const siblings=[...parent.children].filter(x=>x.matches?.('.hint,.visualCaption'));
   if(siblings.length>1){
     const label=el.querySelector('b,strong')?.textContent.replace(/[：:]$/,'').trim()||'';
     const line=document.createElement('div');line.className='help-line';
     if(label){const heading=document.createElement('span');heading.textContent=label;line.append(heading)}
     line.append(pin);el.replaceWith(line);
   }else{
     const heading=parent.querySelector(':scope > h3')||parent.querySelector(':scope > .space > h3');
     if(heading){heading.append(pin);el.remove()}
     else{el.replaceWith(pin)}
   }
 }
}
function closeHelps(except){document.querySelectorAll('.help-button[aria-expanded="true"]').forEach(btn=>{if(btn===except)return;btn.setAttribute('aria-expanded','false');const pop=btn.nextElementSibling;if(pop)pop.hidden=true})}
document.addEventListener('click',e=>{
 const btn=e.target.closest('.help-button');
 if(btn){e.preventDefault();e.stopPropagation();const willOpen=btn.getAttribute('aria-expanded')!=='true';closeHelps(btn);btn.setAttribute('aria-expanded',String(willOpen));const pop=btn.nextElementSibling;if(pop)pop.hidden=!willOpen;return}
 if(!e.target.closest('.help-popup'))closeHelps();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeHelps()});

function render(){common();let fn={home,assets,boss,daily,report,settings}[s.tab]||home;$('#main').innerHTML=fn();compactHints($('#main'));drawPixel();spark();updateLiveInputs();save()}
function updateLiveInputs(){let budget=$('#budgetResult');if(budget){let v=s.quizDraft,food=Number(v.food??8000),fun=Number(v.fun??1000),sv=Number(v.save??3000),sum=food+fun+sv;budget.innerHTML=`合計 ${cash(sum)} ／ 12,000 元<br>${food<8000?'⚠️ 必要支出未達題目設定':'✅ 必要支出已安排'}　${sum>12000?'⚠️ 超支':'✅ 沒有超支'}`}
let goal=$('#goalResult');if(goal){let v=Number(s.quizDraft.goal??2500);goal.innerHTML=`需求：18,000 − 3,000 = 15,000 元；每月須存 2,500 元。<br>${v>=2500?'✅ 目前設定可達目標':'⚠️ 目前設定不足以達標'}。`}}
function recordLearning(data){s.learning.push({date:day(),index:s.qIndex,...data});let id=`${day()}-${s.qIndex}`;if(!s.bonusIds.includes(id)){s.bonusIds.push(id);s.coins+=15}notify('完成學習試煉！獲得 15 枚裝飾金幣。');s.quizDraft={};s.quizStep=0;render()}
function submitQuiz(){if(pickedToday(s.qIndex)){notify('今日已完成此房間。');return}let d=s.quizDraft;let idx=s.qIndex;
 if(idx===0){let food=Number(d.food??8000),fun=Number(d.fun??1000),sv=Number(d.save??3000),sum=food+fun+sv;if([food,fun,sv].some(x=>!Number.isFinite(x)||x<0)){notify('請填入非負金額。');return}recordLearning({correct:food>=8000&&sum<=12000,summary:`必要支出 ${cash(food)}、娛樂 ${cash(fun)}、儲蓄 ${cash(sv)}，共 ${cash(sum)}`});return}
 if(idx===2){let n=Number(d.goal??2500);if(!Number.isFinite(n)||n<0){notify('請輸入有效目標金額。');return}recordLearning({correct:n>=2500,summary:`設定每月存 ${cash(n)}；所需至少 NT$ 2,500`});return}
 if(d.choice===undefined){notify('請先做出選擇。');return}
 if(idx===5){let previous=d.risk||[];previous.push(d.choice);if(s.quizStep<2){s.quizStep++;s.quizDraft={risk:previous};render();return}recordLearning({correct:null,summary:`3 回合選擇：${previous.map(x=>x===0?'穩定':'波動').join('／')}（無對錯）`});return}
 let correct=idx===1?d.choice===0:idx===3?d.choice===1:idx===6?d.choice===2:null;
 let labels=idx===1?emergencyChoices:idx===3?confidenceChoices:idx===4?moodChoices:detectiveChoices;
 recordLearning({correct,summary:labels[d.choice]+(idx===3?`；信心 ${d.confidence??3}/5`:''),confidence:idx===3?(d.confidence??3):null});
}
function resetState(mode){if(!confirm('這會清空目前 V2 的全部資料與進度。是否繼續？'))return;
s=seed();s.mode=mode;if(mode==='custom'){s.assets=[];s.cash=0;s.baseTotal=0;s.baseInvest=0;}s.snapshots=[];initSnapshot();save();render();notify(mode==='custom'?'已建立空白資產庫':'已恢復示範角色')}
function exportData(){let payload={app:'wealth-guardian-pixel-v2',version:2,exportedAt:new Date().toISOString(),data:s};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`財富守護者V2_備份_${day()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function validImport(data){return data&&data.app==='wealth-guardian-pixel-v2'&&data.version===2&&data.data&&typeof data.data==='object'&&Array.isArray(data.data.assets)&&Array.isArray(data.data.records)&&Array.isArray(data.data.learning)&&Array.isArray(data.data.snapshots)&&Array.isArray(data.data.bonusIds)&&Array.isArray(data.data.purchases)&&Array.isArray(data.data.achievements)&&data.data.assets.length<2000&&data.data.records.length<20000&&data.data.learning.length<20000&&data.data.snapshots.length<20000}
function updateInput(target){if(target.dataset.budget){let v=Number(target.value);s.quizDraft[target.dataset.budget]=v;updateLiveInputs();save();return}if(target.id==='goalValue'){s.quizDraft.goal=Number(target.value);updateLiveInputs();save();return}if(target.id==='confidenceLevel'){s.quizDraft.confidence=Number(target.value);let l=$('#confidenceDisplay');if(l)l.textContent=`目前把握程度：${target.value} / 5`;save()}}
document.addEventListener('input',e=>{if(!e.target.closest('.app'))return;updateInput(e.target)});
document.addEventListener('click',e=>{let t=e.target.closest('button[data-nav],button[data-action],button[data-modal],button[data-edit],button[data-trade],button[data-boss],button[data-duration],button[data-domain],button[data-pick],button[data-buy]');if(!t)return;
const d=t.dataset;
if(d.nav){setTab(d.nav);return}
if(d.modal==='add'){addModal();return}
if(d.edit){editModal(d.edit);return}
if(d.trade){tradeModal(d.trade);return}
if(d.boss){s.boss=d.boss;render();return}
if(d.duration){s.duration=Math.max(3,Number(d.duration));render();return}
if(d.domain!==undefined){s.qIndex=Number(d.domain);s.quizStep=0;s.quizDraft={};render();return}
if(d.pick!==undefined){s.quizDraft.choice=Number(d.pick);render();return}
if(d.buy!==undefined){let items=[['青銅盾牌',50],['像素披風',90],['星光旗幟',130]], [name,price]=items[Number(d.buy)];if(!name||s.purchases.includes(name)||s.coins<price)return;s.coins-=price;s.purchases.push(name);render();notify('已兌換 '+name+'，不影響任何投資數據。');return}
if(!d.action)return;
switch(d.action){
 case 'close':$('#modalRoot').innerHTML='';break;
 case 'addAsset':{
 let type=$('#newType')?.value,symbol=$('#newSymbol')?.value.trim().toUpperCase(),name=$('#newName')?.value.trim(),qty=$num('#newQty'),price=$num('#newPrice'),cost=$num('#newCost');
 if(!symbol||!name||!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<=0||!Number.isFinite(cost)||cost<0){notify('請填完整的商品資料及正數持有量／價格。');return}
 if(s.assets.some(x=>x.symbol===symbol)){notify('代碼已存在，請用買賣操作調整持股。');return}
 s.assets.push({id:'a'+Date.now()+'_'+Math.random().toString(36).slice(2,5),type,symbol,name,qty,price,cost});snapshot('manualAdd');$('#modalRoot').innerHTML='';render();notify('持倉已建立。建議重新設定挑戰起點以避免過往資料不完整。');break;
 }
 case 'applyPrice':{let a=s.assets.find(x=>x.id===d.id),v=$num('#editPrice');if(!a||!Number.isFinite(v)||v<0){notify('價格不正確。');return}a.price=v;snapshot('price');$('#modalRoot').innerHTML='';render();notify('手動估值已更新，非實際市場行情。');break}
 case 'applyTrade':{
 let a=s.assets.find(x=>x.id===d.id),type=$('#tradeType')?.value,qty=$num('#tradeQty'),price=$num('#tradePrice');if(!a||!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<=0){notify('交易數量及價格必須大於零。');return}
 let amount=round(qty*price);if(type==='buy'){if(s.cash<amount-0.001){notify('現金不足，無法買進。');return}let before=a.qty;a.qty=round(a.qty+qty);a.cost=(before*a.cost+amount)/a.qty;s.cash=round(s.cash-amount);addRecord('buy',`買進 ${a.symbol} ${qty} 單位，${cash(amount)}`,amount,a.id,qty,0,amount)}
 else {if(a.qty<qty-0.000001){notify('持倉不足，不能賣超過持有的數量。');return}a.qty=round(a.qty-qty);s.cash=round(s.cash+amount);addRecord('sell',`賣出 ${a.symbol} ${qty} 單位，${cash(amount)}`,amount,a.id,-qty,0,-amount)}
 $('#modalRoot').innerHTML='';render();notify('已記錄交易及現金流。');break;
 }
 case 'cashflow':{
 let type=$('#adjustType')?.value,amount=$num('#adjustAmount');if(!Number.isFinite(amount)||amount<=0){notify('請輸入正確金額。');return}
 amount=round(amount);if(type==='withdraw'&&amount>s.cash){notify('現金不足，無法提領。');return}
 if(type==='deposit'){s.cash=round(s.cash+amount);addRecord(type,`外部存入 ${cash(amount)}`,amount,null,0,amount,0)}
 else if(type==='withdraw'){s.cash=round(s.cash-amount);addRecord(type,`外部提領 ${cash(amount)}`,amount,null,0,-amount,0)}
 else if(type==='dividend'){s.cash=round(s.cash+amount);addRecord(type,`股息／配息 ${cash(amount)}`,amount,null,0,0,-amount)}
 render();notify('資金事件已保存。');break;
 }
 case 'snapshot':snapshot('manual');render();notify('已保存本次估值快照。');break;
 case 'rates':{let i=$num('#inflationRate'),m=$num('#marketRate');if(!Number.isFinite(i)||i< -20||i>30||!Number.isFinite(m)||m< -90||m>100){notify('示範年率超出允許範圍。');return}s.inflationYear=i/100;s.benchmarkYear=m/100;render();notify('示範魔王參數已更新。');break}
 case 'restart':if(confirm('使用目前資產與今天的日期建立新挑戰？這會重新計算挑戰起點，但保留流水帳與簽到紀錄。')){s.challengeStart=day();s.baseTotal=total();s.baseInvest=invest();s.startEventCount=s.records.length;snapshot('challengeStart');render();notify('新挑戰開始，至少持續 3 個月。')}break;
 case 'checkin':{
 if(s.lastCheck===day()){notify('今天已經領取簽到獎勵。');return}
 const rewards=[10,15,20,25,30,40,50];
 s.streak=s.lastCheck&&dateDiff(s.lastCheck,day())===1?(s.streak%7)+1:1;
 s.lastCheck=day();s.checkCount++;let amount=rewards[s.streak-1];s.coins+=amount;
 if(s.streak===7&&!s.achievements.includes('七日守護者'))s.achievements.push('七日守護者');
 render();notify(`簽到成功，獲得 ${amount} 枚金幣${s.streak===7?'與七日守護者徽章':''}！`);break;
 }
 case 'submitQuiz':submitQuiz();break;
 case 'export':exportData();notify('資料已整理成 JSON 備份檔。');break;
 case 'import':$('#jsonFile')?.click();break;
 case 'demo':resetState('demo');break;
 case 'blank':resetState('custom');break;
 case 'wipe':if(confirm('確定永久刪除此瀏覽器中所有 V2 的資料？此動作無法還原。')){localStorage.removeItem(KEY);s=seed();s.assets=[];s.cash=0;s.baseTotal=0;s.baseInvest=0;s.mode='custom';s.snapshots=[];initSnapshot();save();render();notify('V2 資料已刪除。')}break;
 }
});
document.addEventListener('change',e=>{if(e.target.id!=='jsonFile')return;let f=e.target.files?.[0];if(!f)return;if(f.size>5*1024*1024){notify('備份檔過大。');return}const reader=new FileReader();reader.onload=()=>{try{let raw=JSON.parse(reader.result);if(!validImport(raw))throw Error('Invalid file');if(!confirm('匯入將覆蓋目前 V2 進度。是否繼續？'))return;let data=raw.data;
// Normalize numeric and textual fields so imported content is safe for the renderer.
let keys=['coins','streak','duration','cash','baseTotal','baseInvest','benchmarkYear','inflationYear','checkCount'];for(const k of keys)if(!Number.isFinite(data[k]))throw Error('Invalid numeric data');
if(data.assets.some(a=>!a||typeof a.id!=='string'||typeof a.symbol!=='string'||typeof a.name!=='string'||![a.qty,a.price,a.cost].every(Number.isFinite)||a.qty<0||a.price<0||a.cost<0))throw Error('Invalid asset');
 s={...seed(),...data,tab:'home',qIndex:0,quizStep:0,quizDraft:{},notice:''};if(s.duration<3)s.duration=3;render();notify('已匯入本機備份。')}
 catch(err){notify('備份格式無法辨識，未更動目前資料。')} };reader.readAsText(f)});
render();
})();
</script></body></html>
